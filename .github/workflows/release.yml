# 📄 Dosya Yolu: /.github/workflows/release.yml
# 📌 Amac: Stable tag'lerde tek combined Windows dagitimini build, production sign, attest ve GitHub Release olarak yayinlar
# 📌 Modul - CI YAML
# Version: 1.2.0
# Aciklama: Bootstrap + app/WinUI + cli layoutunu signing, deterministic ZIP, checksum ve provenance kapilarindan gecirir
# Bagimli Oldugu Katman: Tool | Config

name: Signed Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: windows-2025
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate tag version
        shell: pwsh
        run: ./tools/Assert-ReleaseVersion.ps1 -Tag "${{ github.ref_name }}" -PropsPath Directory.Build.props

      - name: Validate signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          ARTIFACT_SIGNING_TIMESTAMP_URL: ${{ vars.ARTIFACT_SIGNING_TIMESTAMP_URL }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "ARTIFACT_SIGNING_ENDPOINT",
            "ARTIFACT_SIGNING_ACCOUNT_NAME",
            "ARTIFACT_SIGNING_CERT_PROFILE_NAME",
            "ARTIFACT_SIGNING_TIMESTAMP_URL"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required release signing configuration is missing: $name"
            }
          }

      - name: Restore
        run: dotnet restore TurkuazInstaller.Windows.slnx

      - name: Test
        run: dotnet test TurkuazInstaller.slnx --configuration Release

      - name: Publish release binaries
        shell: pwsh
        run: |
          dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/bootstrap
          dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/winui
          dotnet publish src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/cli
          ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap -WinUiRoot artifacts/publish/winui -CliRoot artifacts/publish/cli -OutputRoot artifacts/release/distribution

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign combined release binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\artifacts\release\distribution
          files-folder-filter: TurkuazInstaller*.exe,TurkuazInstaller*.dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: ${{ vars.ARTIFACT_SIGNING_TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: ./tools/Assert-AuthenticodeRelease.ps1 -ReleaseRoot artifacts/release/distribution

      - name: Build deterministic combined archive
        shell: pwsh
        run: ./tools/Assert-ReproducibleArchive.ps1 -SourceDirectory artifacts/release/distribution -OutputPath artifacts/release-assets/TurkuazInstaller-win-x64.zip -PackagerPath tools/release/package_release.py

      - name: Create checksums
        shell: pwsh
        run: ./tools/New-ReleaseChecksums.ps1 -AssetDirectory artifacts/release-assets -OutputPath artifacts/release-assets/SHA256SUMS.txt

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: artifacts/release-assets/TurkuazInstaller-win-x64.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "artifacts/release-assets/TurkuazInstaller-win-x64.zip" "artifacts/release-assets/SHA256SUMS.txt" --verify-tag --title "TurkuazInstaller ${{ github.ref_name }}" --generate-notes
