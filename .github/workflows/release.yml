# 📄 Dosya Yolu: /.github/workflows/release.yml
# 📌 Amac: v1 ve sonrasi tag'lerde reproducible Windows binary uretir, Azure Artifact Signing ile imzalar ve GitHub Release yayinlar
# 📌 Modul - CI YAML
# Version: 1.0.0
# Aciklama: OIDC tabanli production signing, Authenticode verify, SHA-256 checksum ve release asset yayinlama kapisidir
# Bagimli Oldugu Katman: Tool | Config

name: Signed Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  signed-release:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag version
        shell: pwsh
        run: ./tools/Assert-ReleaseVersion.ps1 -Tag "${{ github.ref_name }}" -PropsPath Directory.Build.props

      - name: Validate signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          ARTIFACT_SIGNING_TIMESTAMP_URL: ${{ vars.ARTIFACT_SIGNING_TIMESTAMP_URL }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "ARTIFACT_SIGNING_ENDPOINT",
            "ARTIFACT_SIGNING_ACCOUNT_NAME",
            "ARTIFACT_SIGNING_CERT_PROFILE_NAME",
            "ARTIFACT_SIGNING_TIMESTAMP_URL"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required release signing configuration is missing: $name"
            }
          }

      - name: Restore
        run: dotnet restore TurkuazInstaller.Windows.slnx

      - name: Test
        run: dotnet test TurkuazInstaller.slnx --configuration Release

      - name: Publish release binaries
        shell: pwsh
        run: |
          dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/release/bootstrap
          dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/release/winui

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\artifacts\release
          files-folder-filter: TurkuazInstaller*.exe,TurkuazInstaller*.dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: ${{ vars.ARTIFACT_SIGNING_TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: ./tools/Assert-AuthenticodeRelease.ps1 -ReleaseRoot artifacts/release

      - name: Create release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release-assets -Force | Out-Null
          Compress-Archive -Path artifacts/release/bootstrap/* -DestinationPath artifacts/release-assets/TurkuazInstaller-Bootstrapper-win-x64.zip -CompressionLevel Optimal
          Compress-Archive -Path artifacts/release/winui/* -DestinationPath artifacts/release-assets/TurkuazInstaller-WinUI-win-x64.zip -CompressionLevel Optimal

      - name: Create checksums
        shell: pwsh
        run: ./tools/New-ReleaseChecksums.ps1 -AssetDirectory artifacts/release-assets -OutputPath artifacts/release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "artifacts/release-assets/TurkuazInstaller-Bootstrapper-win-x64.zip" "artifacts/release-assets/TurkuazInstaller-WinUI-win-x64.zip" "artifacts/release-assets/SHA256SUMS.txt" --verify-tag --title "TurkuazInstaller ${{ github.ref_name }}" --generate-notes
