# Dosya Yolu: REPO_ROOT/.github/workflows/antivirus-evidence-lab.yml
# Amac: Windows salt okunur antivirus kanit toplayicisi regresyonu
# Modul - CI YAML
# Version: 1.0.0
# Aciklama: Guvenlik korumalarini degistirmeden imza/hash kaniti semasini test eder
# Bagimli Oldugu Katman: Tool | Testing

name: Antivirus Evidence LAB CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/antivirus-evidence-lab.yml'
      - 'tools/diagnostics/Get-AuthenticodeLabEvidence.ps1'
      - 'tests/scripts/Test-AuthenticodeLabEvidence.ps1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/antivirus-evidence-lab.yml'
      - 'tools/diagnostics/Get-AuthenticodeLabEvidence.ps1'
      - 'tests/scripts/Test-AuthenticodeLabEvidence.ps1'

permissions:
  contents: read

jobs:
  read-only-evidence:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify collector and failure modes without running installer
        shell: pwsh
        run: ./tests/scripts/Test-AuthenticodeLabEvidence.ps1
