# 📄 Dosya Yolu: /.github/workflows/windows-bootstrap.yml
# 📌 Amac: Windows bootstrap ve WinUI projelerini build/publish edip tek combined distribution olarak dogrular
# 📌 Modul - CI YAML
# Version: 1.0.0
# Aciklama: NativeAOT bootstrap -> app/WinUI layoutunu Windows runner uzerinde build, publish ve artifact kalite kapisindan gecirir
# Bagimli Oldugu Katman: Tool

name: Windows Desktop CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows solution
        run: dotnet restore TurkuazInstaller.Windows.slnx

      - name: Build Windows solution
        run: dotnet build TurkuazInstaller.Windows.slnx --configuration Release --no-restore

      - name: Publish NativeAOT bootstrap
        run: dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/bootstrap/win-x64

      - name: Publish WinUI desktop
        run: dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/winui/win-x64

      - name: Build combined distribution
        shell: pwsh
        run: ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap/win-x64 -WinUiRoot artifacts/publish/winui/win-x64 -OutputRoot artifacts/distribution/win-x64

      - name: Verify combined startup layout
        shell: pwsh
        run: |
          $bootstrap = "artifacts/distribution/win-x64/TurkuazInstaller.Bootstrapper.exe"
          $desktop = "artifacts/distribution/win-x64/app/TurkuazInstaller.WinUI.exe"

          if (-not (Test-Path -LiteralPath $bootstrap)) {
            throw "Combined distribution bootstrap executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
            throw "Combined distribution WinUI executable was not produced."
          }

      - name: Upload combined distribution
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazInstaller-win-x64
          path: artifacts/distribution/win-x64/
          if-no-files-found: error
