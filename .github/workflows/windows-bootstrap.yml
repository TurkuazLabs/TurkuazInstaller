# 📄 Dosya Yolu: /.github/workflows/windows-bootstrap.yml
# 📌 Amac: Windows bootstrap ve WinUI projelerini build/publish edip tek combined distribution olarak dogrular
# 📌 Modul - CI YAML
# Version: 1.3.0
# Aciklama: Mevcut win-x64 kalite kapisini korur ve native win-arm64 bootstrap+WinUI+CLI combined distribution publish/layout dogrulamasini ekler
# Bagimli Oldugu Katman: Tool

name: Windows Desktop CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows solution
        run: dotnet restore TurkuazInstaller.Windows.slnx

      - name: Build Windows solution
        run: dotnet build TurkuazInstaller.Windows.slnx --configuration Release --no-restore

      - name: Test bootstrap orchestration
        run: dotnet test tests/TurkuazInstaller.Bootstrapper.Tests/TurkuazInstaller.Bootstrapper.Tests.csproj --configuration Release --no-restore

      - name: Test Windows prerequisite adapters
        run: dotnet test tests/TurkuazInstaller.Platform.Windows.Tests/TurkuazInstaller.Platform.Windows.Tests.csproj --configuration Release --no-restore

      - name: Test CLI silent mode
        run: dotnet test tests/TurkuazInstaller.Cli.Tests/TurkuazInstaller.Cli.Tests.csproj --configuration Release --no-restore

      - name: Publish NativeAOT bootstrap
        run: dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/bootstrap/win-x64

      - name: Publish WinUI desktop
        run: dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/winui/win-x64

      - name: Publish CLI
        run: dotnet publish src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/cli/win-x64

      - name: Build combined distribution
        shell: pwsh
        run: ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap/win-x64 -WinUiRoot artifacts/publish/winui/win-x64 -CliRoot artifacts/publish/cli/win-x64 -OutputRoot artifacts/distribution/win-x64

      - name: Verify combined startup layout
        shell: pwsh
        run: |
          $bootstrap = "artifacts/distribution/win-x64/TurkuazInstaller.Bootstrapper.exe"
          $desktop = "artifacts/distribution/win-x64/app/TurkuazInstaller.WinUI.exe"
          $cli = "artifacts/distribution/win-x64/cli/TurkuazInstaller.Cli.exe"

          if (-not (Test-Path -LiteralPath $bootstrap)) {
            throw "Combined distribution bootstrap executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
            throw "Combined distribution WinUI executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $cli)) {
            throw "Combined distribution CLI executable was not produced."
          }

      - name: Upload combined distribution
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazInstaller-win-x64
          path: artifacts/distribution/win-x64/
          if-no-files-found: error


  arm64-distribution:
    runs-on: windows-2025
    timeout-minutes: 30
    needs:
      - windows-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ARM64 NativeAOT bootstrap
        run: dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/bootstrap/win-arm64

      - name: Publish ARM64 WinUI desktop
        run: dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/winui/win-arm64

      - name: Publish ARM64 CLI
        run: dotnet publish src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/cli/win-arm64

      - name: Build ARM64 combined distribution
        shell: pwsh
        run: ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap/win-arm64 -WinUiRoot artifacts/publish/winui/win-arm64 -CliRoot artifacts/publish/cli/win-arm64 -OutputRoot artifacts/distribution/win-arm64

      - name: Verify ARM64 combined startup layout
        shell: pwsh
        run: |
          $bootstrap = "artifacts/distribution/win-arm64/TurkuazInstaller.Bootstrapper.exe"
          $desktop = "artifacts/distribution/win-arm64/app/TurkuazInstaller.WinUI.exe"
          $cli = "artifacts/distribution/win-arm64/cli/TurkuazInstaller.Cli.exe"

          if (-not (Test-Path -LiteralPath $bootstrap)) {
            throw "ARM64 combined distribution bootstrap executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
            throw "ARM64 combined distribution WinUI executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $cli)) {
            throw "ARM64 combined distribution CLI executable was not produced."
          }

      - name: Upload ARM64 combined distribution
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazInstaller-win-arm64
          path: artifacts/distribution/win-arm64/
          if-no-files-found: error
