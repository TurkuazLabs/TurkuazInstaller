# 📄 Dosya Yolu: /.github/workflows/windows-bootstrap.yml
# 📌 Amac: Windows bootstrap ve WinUI projelerini build/publish edip tek combined distribution olarak dogrular
# 📌 Modul - CI YAML
# Version: 1.5.5
# Aciklama: Mevcut win-x64 kalite kapisini korur ve native win-arm64 bootstrap+WinUI+CLI combined distribution publish/layout dogrulamasini ekler
# Bagimli Oldugu Katman: Tool

name: Windows Desktop CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Parse security LAB PowerShell tool without executing it
        shell: pwsh
        run: |
          $tool = 'tools/diagnostics/Get-AuthenticodeLabEvidence.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $tool).Path,
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Authenticode LAB evidence script has parse errors.'
          }

      - name: Smoke test unsigned LAB evidence and no-overwrite guard
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'authenticode-evidence-smoke'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $fixture = Join-Path $root 'unsigned-fixture.exe'
          $evidence = Join-Path $root 'evidence.json'
          [System.IO.File]::WriteAllText($fixture, 'LAB unsigned fixture')
          ./tools/diagnostics/Get-AuthenticodeLabEvidence.ps1 -ArtifactPath $fixture -CaseId REV-09 -OutputPath $evidence
          $result = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if ($result.case_id -ne 'REV-09' -or $result.windows_authenticode_status -eq 'Valid') {
            throw 'Unsigned LAB fixture was not recorded as rejected.'
          }
          if ($result.installer_winverifytrust_result -ne 'NOT_RUN' -or
              $result.release_acceptance -ne 'NOT_ACCEPTED') {
            throw 'Evidence wrongly implies real Installer verification or release acceptance.'
          }
          $before = (Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash
          $wasRejected = $false
          try {
            ./tools/diagnostics/Get-AuthenticodeLabEvidence.ps1 -ArtifactPath $fixture -CaseId REV-09 -OutputPath $evidence
          } catch {
            $wasRejected = $true
          }
          if (-not $wasRejected -or $before -ne (Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash) {
            throw 'Existing LAB evidence must not be overwritten.'
          }

      - name: Restore Windows solution
        run: dotnet restore TurkuazInstaller.Windows.slnx

      - name: Build Windows solution
        run: dotnet build TurkuazInstaller.Windows.slnx --configuration Release --no-restore

      - name: Compile real Authenticode LAB adapter probe
        run: dotnet build tests/TurkuazInstaller.Authenticode.LabProbe/TurkuazInstaller.Authenticode.LabProbe.csproj --configuration Release

      - name: Real Authenticode adapter negative LAB smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'authenticode-real-adapter-smoke'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $fixture = Join-Path $root 'unsigned.exe'
          $output = Join-Path $root 'real-adapter.json'
          [System.IO.File]::WriteAllText($fixture, 'unsigned LAB data')
          dotnet run --project tests/TurkuazInstaller.Authenticode.LabProbe/TurkuazInstaller.Authenticode.LabProbe.csproj --configuration Release --no-build -- --artifact $fixture --publisher 'CN=LAB Only' --cert-sha256 ('0' * 64) --case REV-09 --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Real LAB adapter probe exited with error.' }
          $evidence = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($evidence.verifier -ne 'WindowsAuthenticodeArtifactSignatureVerifier' -or
              $evidence.installer_winverifytrust_result -ne 'REJECTED' -or
              $evidence.release_acceptance -ne 'NOT_ACCEPTED') {
            throw 'LAB adapter did not reject unsigned fixture with explicitly unapproved release status.'
          }
          $originalHash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
          $previousNativePreference = $PSNativeCommandUseErrorActionPreference
          try {
            # Nonzero is expected here: the probe must refuse existing evidence.
            $PSNativeCommandUseErrorActionPreference = $false
            dotnet run --project tests/TurkuazInstaller.Authenticode.LabProbe/TurkuazInstaller.Authenticode.LabProbe.csproj --configuration Release --no-build -- --artifact $fixture --publisher 'CN=LAB Only' --cert-sha256 ('0' * 64) --case REV-09 --output $output
            $rejectedExitCode = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $previousNativePreference
          }
          if ($rejectedExitCode -eq 0) { throw 'LAB adapter must reject overwrite.' }
          if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -ne $originalHash) {
            throw 'LAB adapter changed immutable evidence.'
          }

      - name: Test bootstrap orchestration
        run: dotnet test tests/TurkuazInstaller.Bootstrapper.Tests/TurkuazInstaller.Bootstrapper.Tests.csproj --configuration Release --no-restore

      - name: Test Windows prerequisite adapters
        run: dotnet test tests/TurkuazInstaller.Platform.Windows.Tests/TurkuazInstaller.Platform.Windows.Tests.csproj --configuration Release --no-restore

      - name: Test CLI silent mode
        run: dotnet test tests/TurkuazInstaller.Cli.Tests/TurkuazInstaller.Cli.Tests.csproj --configuration Release --no-restore

      - name: Compile signed-release inventory LAB probe
        run: dotnet build tests/TurkuazInstaller.Inventory.LabProbe/TurkuazInstaller.Inventory.LabProbe.csproj --configuration Release

      - name: Publish NativeAOT bootstrap
        run: dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/bootstrap/win-x64

      - name: Publish WinUI desktop
        run: dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/winui/win-x64

      - name: Publish CLI
        run: dotnet publish src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/cli/win-x64

      - name: Build combined distribution
        shell: pwsh
        run: ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap/win-x64 -WinUiRoot artifacts/publish/winui/win-x64 -CliRoot artifacts/publish/cli/win-x64 -OutputRoot artifacts/distribution/win-x64

      - name: Verify combined startup layout
        shell: pwsh
        run: |
          $bootstrap = "artifacts/distribution/win-x64/TurkuazInstaller.Bootstrapper.exe"
          $desktop = "artifacts/distribution/win-x64/app/TurkuazInstaller.WinUI.exe"
          $cli = "artifacts/distribution/win-x64/cli/TurkuazInstaller.Cli.exe"

          if (-not (Test-Path -LiteralPath $bootstrap)) {
            throw "Combined distribution bootstrap executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
            throw "Combined distribution WinUI executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $cli)) {
            throw "Combined distribution CLI executable was not produced."
          }

      - name: Read-only x64 pilot PE/signature preflight
        shell: pwsh
        run: ./tools/Test-WindowsPilotPreflight.ps1 -DistributionRoot artifacts/distribution/win-x64 -Architecture x64

      - name: Upload combined distribution
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazInstaller-win-x64
          path: artifacts/distribution/win-x64/
          if-no-files-found: error


  arm64-distribution:
    runs-on: windows-2025
    timeout-minutes: 30
    needs:
      - windows-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ARM64 NativeAOT bootstrap
        run: dotnet publish src/TurkuazInstaller.Bootstrapper/TurkuazInstaller.Bootstrapper.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/bootstrap/win-arm64

      - name: Publish ARM64 WinUI desktop
        run: dotnet publish src/TurkuazInstaller.WinUI/TurkuazInstaller.WinUI.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/winui/win-arm64

      - name: Publish ARM64 CLI
        run: dotnet publish src/TurkuazInstaller.Cli/TurkuazInstaller.Cli.csproj --configuration Release --runtime win-arm64 --self-contained true --output artifacts/publish/cli/win-arm64

      - name: Build ARM64 combined distribution
        shell: pwsh
        run: ./tools/New-CombinedDistribution.ps1 -BootstrapRoot artifacts/publish/bootstrap/win-arm64 -WinUiRoot artifacts/publish/winui/win-arm64 -CliRoot artifacts/publish/cli/win-arm64 -OutputRoot artifacts/distribution/win-arm64

      - name: Verify ARM64 combined startup layout
        shell: pwsh
        run: |
          $bootstrap = "artifacts/distribution/win-arm64/TurkuazInstaller.Bootstrapper.exe"
          $desktop = "artifacts/distribution/win-arm64/app/TurkuazInstaller.WinUI.exe"
          $cli = "artifacts/distribution/win-arm64/cli/TurkuazInstaller.Cli.exe"

          if (-not (Test-Path -LiteralPath $bootstrap)) {
            throw "ARM64 combined distribution bootstrap executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
            throw "ARM64 combined distribution WinUI executable was not produced."
          }

          if (-not (Test-Path -LiteralPath $cli)) {
            throw "ARM64 combined distribution CLI executable was not produced."
          }

      - name: Read-only ARM64 pilot PE/signature preflight
        shell: pwsh
        run: ./tools/Test-WindowsPilotPreflight.ps1 -DistributionRoot artifacts/distribution/win-arm64 -Architecture arm64

      - name: Upload ARM64 combined distribution
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazInstaller-win-arm64
          path: artifacts/distribution/win-arm64/
          if-no-files-found: error
