# Dosya Yolu: REPO_ROOT/.github/workflows/rust-migration.yml
# Amac: Asamali Rust gecisindeki kodu release olusturmadan derleme seviyesinde dogrulamak
# Modul - GitHub Actions YAML
# Version: 0.2.1
# Aciklama: Rust workspace icin format/compile kontrolu ve kisa omurlu Windows development CLI artifact'i uretir
# Bagimli Oldugu Katman: Tool | Repo

name: Rust Migration CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust/**"
      - ".github/workflows/rust-migration.yml"
  push:
    branches:
      - rewrite/rust-community
    paths:
      - "rust/**"
      - ".github/workflows/rust-migration.yml"

concurrency:
  group: rust-migration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Rust toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Compile workspace
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets

  rust-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Windows workspace
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets

      - name: Build development CLI
        run: cargo build --manifest-path rust/Cargo.toml -p turkuaz-installer-cli --release --bin turkuaz-installer

      - name: Upload development CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-installer-cli-development-windows-x64
          path: rust/target/release/turkuaz-installer.exe
          if-no-files-found: error
          retention-days: 7
