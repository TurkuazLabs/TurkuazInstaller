# 📄 Dosya Yolu: /.github/workflows/core-ci.yml
# 📌 Amac: TurkuazInstaller Core projelerini restore, build ve unit test ile dogrular
# 📌 Modul - CI YAML
# Version: 0.4.0
# Aciklama: Core .NET ve imzali tema paketleme icin Linux tabanli kalite kapisidir
# Bagimli Oldugu Katman: Tool

name: Core CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test signed theme pack builder with ephemeral local certificate
        run: python3 -m unittest discover -s tools/theme-pack -p 'test_*.py' -v
      - name: Restore
        run: dotnet restore TurkuazInstaller.slnx
      - name: Build
        run: dotnet build TurkuazInstaller.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TurkuazInstaller.slnx --configuration Release --no-build
