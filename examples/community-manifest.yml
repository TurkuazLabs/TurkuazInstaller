# Dosya Yolu: REPO_ROOT/examples/community-manifest.yml
# Amac: Rust .tzpkg icin detached CMS ile imzalanacak schema v1 ornegi
# Modul - YAML Example
# Version: 2.0.0
# Aciklama: Sadece Rust runtime'in bugun kabul ettigi basit signed full paket alani
# Bagimli Oldugu Katman: Documentation | Config

# TEST TEMPLATE: URL, digest ve boyut temsili degerlerdir; dogrudan kurulum yapmaz.
# Bu YAML'in gercek yayin byte'lari CMS/PKCS#7 detached olarak imzalanmali.
# Yayin politikasi (publisher subject ve certificate pin) AYRI trust dosyasindadir.
# Windows prereq, kisayol, protokol ve preserve_paths adapter'lari Rust'ta
# henuz uygulanmadi; bu ornege bilerek dahil edilmedi.
schema_version: 1

package:
  id: example-app
  version: 1.2.3
  channel: stable

artifact:
  uri: https://downloads.example.invalid/example-app/1.2.3/application.tzpkg
  sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  size_bytes: 1048576

install:
  mode: full
  target: "%LOCALAPPDATA%/Programs/ExampleApp"

rollback:
  supported: false
  previous_version_required: false
