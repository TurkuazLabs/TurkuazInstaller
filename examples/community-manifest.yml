# 📄 Dosya Yolu: /examples/community-manifest.yml
# 📌 Amac: TurkuazInstaller Community Stable v1 manifest contracti icin calisabilir ornek paket tanimlamak
# 📌 Modul - YAML
# Version: 1.3.0
# Aciklama: Detached trust, prerequisite auto-install, preserve path, package-owned Windows shortcut/protocol ve rollback alanlarini ornekler
# Bagimli Oldugu Katman: Config

# Bu dosya raw byte'lari ile imzalanmali ve yaninda community-manifest.yml.p7s publish edilmelidir.
# Manifest signer trust bilgisi bu manifestin icinde degil external manifest-trust.yml store'unda tutulur.

schema_version: 1

package:
  id: example-app
  version: 1.2.3
  channel: stable

artifact:
  uri: https://downloads.example.invalid/example-app/1.2.3/ExampleApp-Setup.exe
  sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  size_bytes: 1048576
  signature:
    algorithm: authenticode
    publisher_subject: "CN=Example Software"

install:
  mode: full
  target: "%LOCALAPPDATA%/Programs/ExampleApp"
  prerequisites:
    - id: windows-build
      version: ">=17763"
    - id: architecture
      version: "x64"
    - id: dotnet-desktop-runtime
      version: ">=10.0.0"
      install:
        artifact:
          uri: https://downloads.example.invalid/prerequisites/windowsdesktop-runtime-10.0.0-win-x64.exe
          sha256: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          size_bytes: 12345678
          signature:
            algorithm: authenticode
            publisher_subject: "CN=Microsoft Corporation"
        arguments:
          - "/install"
          - "/quiet"
          - "/norestart"
        requires_elevation: true
  preserve_paths:
    - "UserData"
  windows:
    shortcuts:
      - id: main
        name: Example App
        location: start_menu
        executable: ExampleApp.exe
      - id: desktop
        name: Example App
        location: desktop
        executable: ExampleApp.exe
    protocols:
      - scheme: example-app
        executable: ExampleApp.exe

rollback:
  supported: true
  previous_version_required: true
