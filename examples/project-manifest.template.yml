# Dosya Yolu: REPO_ROOT/examples/project-manifest.template.yml
# Amac: Rust installer icin minimal signed full .tzpkg release sablonu
# Modul - YAML Template
# Version: 2.0.0
# Aciklama: Uygulanmamis legacy prereq/shortcut/preserve alanlarini ornekten ayirir
# Bagimli Oldugu Katman: Documentation | Config

# TEMPLATE: Tum __PLACEHOLDER__ alanlarini gercek degerle degistirin.
# Detached CMS/PKCS#7 (.p7s) imzasi manifestin EXACT byte'larina uygulanir.
# Out-of-band manifest trust policy, gercek yayinci subject ve sertifika
# SHA-256 pin'i istemcide guvenli bicimde ayri dagitilmalidir.
# Paket artifact'i .tzpkg olmali, dogru boyut/hash hesaplanmalidir.
# Prerequisites, Windows shortcut/protocol, preserve_paths, delta ve
# background-updates Rust runtime icin henuz etkin ozellik degildir.
schema_version: 1

package:
  id: "__PACKAGE_ID__"
  version: "__SEMVER__"
  channel: stable

artifact:
  uri: "__HTTPS_TZPKG_URI__"
  sha256: "__64_CHAR_SHA256__"
  size_bytes: 1

install:
  mode: full
  target: "__INSTALL_TARGET_PATH__"

rollback:
  supported: false
  previous_version_required: false
