# 📄 Dosya Yolu: /examples/project-manifest.template.yml
# 📌 Amac: TurkuazInstaller'a gececek projeler icin reusable Stable v1 manifest sablonu saglar
# 📌 Modul - Config YAML
# Version: 1.2.0
# Aciklama: Detached .p7s trust, full install, guvenli prerequisite detection/auto-install, preserve path ve rollback alanlarini migration icin standartlastirir
# Bagimli Oldugu Katman: Config

# Release pipeline bu dosyanin raw byte'larini CMS/PKCS#7 detached olarak imzalamali.
# Sidecar adi: <manifest-file>.p7s
# Signer publisher/certificate SHA-256 trust anchor external manifest-trust.yml store'unda provision edilir.

schema_version: 1

package:
  id: "__PACKAGE_ID__"
  version: "__SEMVER__"
  channel: stable

artifact:
  uri: "__HTTPS_OR_FILE_ARTIFACT_URI__"
  sha256: "__64_CHAR_SHA256__"
  size_bytes: 1
  signature:
    algorithm: authenticode
    publisher_subject: "__PUBLISHER_SUBJECT__"
    # certificate_sha256: "__OPTIONAL_ARTIFACT_CERTIFICATE_SHA256_PIN__"

install:
  mode: full
  target: "%LOCALAPPDATA%/Programs/__PRODUCT_DIRECTORY__"
  prerequisites:
    - id: windows-build
      version: ">=17763"
    - id: architecture
      version: "x64"
    # Optional auto-install ornegi:
    # - id: dotnet-desktop-runtime
    #   version: ">=10.0.0"
    #   install:
    #     artifact:
    #       uri: "__HTTPS_OR_FILE_PREREQUISITE_INSTALLER_URI__"
    #       sha256: "__64_CHAR_SHA256__"
    #       size_bytes: 1
    #       signature:
    #         algorithm: authenticode
    #         publisher_subject: "__PREREQUISITE_PUBLISHER_SUBJECT__"
    #         # certificate_sha256: "__OPTIONAL_PREREQUISITE_CERTIFICATE_SHA256_PIN__"
    #     arguments:
    #       - "/install"
    #       - "/quiet"
    #       - "/norestart"
    #     requires_elevation: true
  preserve_paths:
    - "UserData"

rollback:
  supported: true
  previous_version_required: true
