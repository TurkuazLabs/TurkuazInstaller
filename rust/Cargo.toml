# Dosya Yolu: REPO_ROOT/rust/Cargo.toml
# Amac: TurkuazInstaller Rust gecis workspace'ini tanimlamak
# Modul - Cargo Workspace
# Version: 0.3.0
# Aciklama: Mevcut .NET uygulamasini asamali Rust portuyla yan yana tutar
# Bagimli Oldugu Katman: Tool | Config

[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/metadata",
    "crates/artifact-verification",
    "crates/manifest-verification",
]

[workspace.dependencies]
tokio = { version = "1", features = ["io-util"] }
