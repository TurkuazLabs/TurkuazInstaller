# Dosya Yolu: REPO_ROOT/rust/crates/artifact-verification/Cargo.toml
# Amac: Artifact boyut ve SHA-256 dogrulama kutuphanesi bagimliliklarini tanimlamak
# Modul - Cargo Package
# Version: 0.1.0
# Aciklama: Indirilen stream'i kurulumdan once domain'deki signed artifact beklentisine gore dogrular
# Bagimli Oldugu Katman: Tool | Config

[package]
name = "turkuaz-installer-artifact-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
sha2 = "0.10"
tokio.workspace = true
turkuaz-installer-domain = { path = "../domain" }

[lib]
name = "turkuaz_installer_artifact_verification"
path = "src/lib.rs"
