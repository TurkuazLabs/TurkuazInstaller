# Dosya Yolu: REPO_ROOT/rust/crates/authenticode-verification/Cargo.toml
# Amac: Windows Authenticode dogrulama crate bagimliliklarini tanimlamak
# Modul - Cargo Package
# Version: 0.1.0
# Aciklama: Imzali artifact publisher ve certificate pin denetimi
# Bagimli Oldugu Katman: Tool | Config

[package]
name = "turkuaz-installer-authenticode-verification"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
sha2 = "0.10"
turkuaz-installer-domain = { path = "../domain" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_WinTrust"] }

[lib]
name = "turkuaz_installer_authenticode_verification"
path = "src/lib.rs"
