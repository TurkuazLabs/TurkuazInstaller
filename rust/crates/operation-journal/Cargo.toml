# Dosya Yolu: REPO_ROOT/rust/crates/operation-journal/Cargo.toml
# Amac: Package bazli operation journal checkpointlerini JSON dosyasinda saklamak
# Modul - Cargo Package
# Version: 0.1.0
# Aciklama: Durable journal okuma, atomik kaydetme ve temizleme islemlerini saglar
# Bagimli Oldugu Katman: Repo

[package]
name = "turkuaz-installer-operation-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio.workspace = true
uuid = { version = "1", features = ["serde", "v4"] }
turkuaz-installer-domain = { path = "../domain" }

[lib]
name = "turkuaz_installer_operation_journal"
path = "src/lib.rs"
