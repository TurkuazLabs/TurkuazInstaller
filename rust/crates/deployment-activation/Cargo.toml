# Dosya Yolu: REPO_ROOT/rust/crates/deployment-activation/Cargo.toml
# Amac: Hazirlanan uygulama payload'larini surumlu dizinlere yayinlamak ve etkin surumu atomik secmek
# Modul - Cargo Package
# Version: 0.1.0
# Aciklama: Current pointer'i degistirmeden once immutable deployment kopyasi olusturur
# Bagimli Oldugu Katman: Service | Infrastructure

[package]
name = "turkuaz-installer-deployment-activation"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turkuaz-installer-domain = { path = "../domain" }
turkuaz-installer-package-engine = { path = "../package-engine" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lib]
name = "turkuaz_installer_deployment_activation"
path = "src/lib.rs"
