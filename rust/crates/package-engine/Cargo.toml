# Dosya Yolu: REPO_ROOT/rust/crates/package-engine/Cargo.toml
# Amac: Rust installerin kendi paket uygulama motoru icin crate bagimliliklarini tanimlamak
# Modul - Cargo Manifest
# Version: 0.3.1
# Aciklama: Dogrulanmis Turkuaz ZIP paketlerini guvenli staging icin baglar
# Bagimli Oldugu Katman: Service | Tool

[package]
name = "turkuaz-installer-package-engine"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
turkuaz-installer-artifact-validation = { path = "../artifact-validation" }
turkuaz-installer-domain = { path = "../domain" }
