# Dosya Yolu: REPO_ROOT/rust/crates/manifest-parser/Cargo.toml
# Amac: Signature-verified installer manifest YAML'ini typed domain release modeline donusturmek
# Modul - Cargo Package
# Version: 0.1.0
# Aciklama: Stable v1 manifest schema'sini .NET davranis referansiyla parse eder
# Bagimli Oldugu Katman: Application

[package]
name = "turkuaz-installer-manifest-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
turkuaz-installer-domain = { path = "../domain" }

[lib]
name = "turkuaz_installer_manifest_parser"
path = "src/lib.rs"
