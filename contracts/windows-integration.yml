# 📄 Dosya Yolu: /contracts/windows-integration.yml
# 📌 Amac: Windows shortcut/protocol entegrasyon action, ownership ve cleanup guvenlik invariantlarini contract-first tanimlar
# 📌 Modul - YAML
# Version: 1.2.0
# Aciklama: Ownership/cleanup kurallarina ek olarak integration reconcile basarisini install state commit onkosulu olarak sabitler
# Bagimli Oldugu Katman: Domain | Service | Repo | Tool | Config

schema_version: 1

scope:
  platform: windows
  user_scope_only: true
  machine_wide_registry: false
  requires_elevation: false

receipt:
  path: "%LOCALAPPDATA%/TurkuazInstaller/integrations/{package_id}.json"
  package_scoped: true
  atomic_write: true
  shortcut_ownership:
    fields:
      - action_id
      - path
      - sha256
  protocol_ownership:
    registry_value: TurkuazInstallerOwner
    value: package_id

shortcuts:
  maximum: 32
  locations:
    - desktop
    - start_menu
  executable:
    relative_to_install_root: true
    extension: .exe
    path_escape: deny
    reparse_point: deny
    must_exist_after_package_apply: true
  collision:
    unowned_existing_file: deny
    modified_owned_file_overwrite: deny
  cleanup:
    delete_only_when_sha256_matches_receipt: true
    path_must_match_supported_location: true

protocols:
  maximum: 32
  registry_root: HKCU\Software\Classes
  scheme:
    normalized_lowercase: true
    maximum_length: 32
  executable:
    relative_to_install_root: true
    extension: .exe
    path_escape: deny
    reparse_point: deny
    must_exist_after_package_apply: true
  command:
    shell: false
    fixed_argument: "%1"
  claim:
    cross_process_lock: true
    existing_foreign_owner: deny
  cleanup:
    delete_only_when_owner_marker_matches: true
    scheme_validation_required: true

workflow:
  install_reconcile_before_state_commit: true
  update_reconcile_before_state_commit: true
  repair_reconcile_after_package_repair: true
  rollback_reconcile_before_state_commit: true
  state_commit_requires_reconcile_success: true
  uninstall_cleanup_after_package_uninstall: true
  uninstall_cleanup_failure:
    package_state_delete_continues: true
    receipt_preserved: true
    structured_warning: true

security:
  overwrite_foreign_shortcut: deny
  delete_modified_shortcut: deny
  overwrite_foreign_protocol: deny
  delete_foreign_protocol: deny
  executable_outside_install_root: deny
  reparse_point_executable: deny
  shell_command_interpretation: deny
  machine_wide_registry: deny
  corrupt_receipt_path_escape: deny
  invalid_receipt_protocol_scheme: deny
