# 📄 Dosya Yolu: /contracts/installer-manifest.yml
# 📌 Amac: TurkuazInstaller Community Stable v1 paket manifest contract alanlarini ve guvenlik invariantlarini tanimlamak
# 📌 Modul - YAML
# Version: 1.6.0
# Aciklama: Detached trust, bounded artifact transfer, prerequisite/reboot resume ve signed Windows integration action contractini runtime ile birebir sabitler
# Bagimli Oldugu Katman: Application | Port | Adapter | Config

schema_version: 1

manifest_trust:
  contract: manifest-trust.yml
  required_before_parse: true

required:
  package:
    - id
    - version
    - channel
  artifact:
    - uri
    - sha256
    - size_bytes
  install:
    - mode
    - target
  rollback:
    - supported

package:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
  version:
    type: semver
  channel:
    allowed:
      - stable
      - beta

artifact:
  uri:
    allowed_schemes:
      - https
      - file
  sha256:
    format: hex
    length: 64
    required_before_install: true
  size_bytes:
    type: integer
    minimum: 1
    enforced_during_transfer: true
    remote_content_length_exact_when_present: true
    oversize_stream: deny
    undersize_stream: deny
    local_size_mismatch: deny
  signature:
    optional: true
    algorithm:
      - authenticode
    publisher_subject:
      required_when_present: true
      type: string
    certificate_sha256:
      optional: true
      format: hex
      length: 64

install:
  windows_integration_contract: windows-integration.yml
  mode:
    allowed:
      - full
  target:
    type: string
  prerequisites:
    type: array
    supported_ids:
      - windows-build
      - architecture
      - dotnet-desktop-runtime
    detection:
      engine: detector_registry
      unknown_id: deny
    auto_install:
      optional: true
      artifact:
        allowed_schemes:
          - https
          - file
        file_extension: .exe
        sha256_required_before_execute: true
        authenticode_required: true
        publisher_subject_required: true
        certificate_sha256_optional: true
      arguments:
        type: array
        shell_interpretation: false
      requires_elevation:
        type: boolean
      post_install_reprobe_required: true
      reboot_required_exit: persist_request_schedule_runonce_reprobe_resume
      resume:
        journal_phases:
          - reboot_resume_armed
          - awaiting_reboot
        persisted_request_required: true
        relaunch: hkcu_runonce_bootstrap
        deferred_delete_value_prefix: true
        signed_manifest_revalidation_required: true
        expected_version_pin_required: true
        expected_artifact_sha256_pin_required: true
        pending_prerequisite_reprobe_required: true
        repeat_same_installer_when_still_unsatisfied: false
        manual_mutation_while_awaiting_reboot: deny
  preserve_paths:
    type: array
    relative_to_install_root: true
    current_directory_forbidden: true
  windows:
    optional: true
    shortcuts:
      type: array
      maximum: 32
      required_fields:
        - id
        - name
        - location
        - executable
      locations:
        - desktop
        - start_menu
      executable:
        relative_to_install_root: true
        extension: .exe
        path_escape: deny
    protocols:
      type: array
      maximum: 32
      required_fields:
        - scheme
        - executable
      executable:
        relative_to_install_root: true
        extension: .exe
        path_escape: deny

rollback:
  supported:
    type: boolean
  previous_version_required_when_supported: true

security:
  unsigned_manifest: deny
  missing_manifest_trust: deny
  checksum_failure: deny
  invalid_signature: deny
  publisher_mismatch: deny
  certificate_pin_mismatch: deny
  concurrent_package_operation: deny
  unsigned_artifact_policy: explicit_product_policy
  transport_http_remote: deny
  path_escape: deny
  unsupported_prerequisite: deny
  unsigned_prerequisite_installer: deny
  prerequisite_hash_failure: deny
  prerequisite_signature_failure: deny
  prerequisite_post_install_unsatisfied: deny
  resume_journal_mismatch: deny
  resume_release_identity_mismatch: deny
  windows_integration_foreign_ownership: deny
  windows_integration_path_escape: deny
