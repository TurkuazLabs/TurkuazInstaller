# 📄 Dosya Yolu: /contracts/installer-manifest.yml
# 📌 Amac: TurkuazInstaller Community Stable v1 paket manifest contract alanlarini ve guvenlik invariantlarini tanimlamak
# 📌 Modul - YAML
# Version: 1.0.0
# Aciklama: Paket, full install, SHA-256, optional Authenticode, prerequisite, preserve path ve rollback alanlarini runtime ile birebir sabitler
# Bagimli Oldugu Katman: Application | Port | Adapter | Config

schema_version: 1

required:
  package:
    - id
    - version
    - channel
  artifact:
    - uri
    - sha256
    - size_bytes
  install:
    - mode
    - target
  rollback:
    - supported

package:
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
  version:
    type: semver
  channel:
    allowed:
      - stable
      - beta

artifact:
  uri:
    allowed_schemes:
      - https
      - file
  sha256:
    format: hex
    length: 64
    required_before_install: true
  size_bytes:
    type: integer
    minimum: 1
  signature:
    optional: true
    algorithm:
      - authenticode

install:
  mode:
    allowed:
      - full
  target:
    type: string
  prerequisites:
    type: array
    supported_ids:
      - windows-build
      - architecture
      - dotnet-desktop-runtime
  preserve_paths:
    type: array
    relative_to_install_root: true
    current_directory_forbidden: true

rollback:
  supported:
    type: boolean
  previous_version_required_when_supported: true

security:
  checksum_failure: deny
  invalid_signature: deny
  unsigned_artifact_policy: explicit_product_policy
  transport_http_remote: deny
  path_escape: deny
  unsupported_prerequisite: deny
