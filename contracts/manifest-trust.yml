# 📄 Dosya Yolu: /contracts/manifest-trust.yml
# 📌 Amac: Detached installer manifest signature ve dis trust store guvenlik kontratini tanimlamak
# 📌 Modul - YAML
# Version: 1.2.0
# Aciklama: CMS/PKCS#7 trust zincirine remote/local manifest ve detached signature byte limitlerini de fail-closed invariant olarak ekler
# Bagimli Oldugu Katman: Service | Repo | Tool | Config

schema_version: 1

content_limits:
  manifest_max_bytes: 1048576
  detached_signature_max_bytes: 262144
  remote_stream_enforced: true
  local_file_enforced: true
  remote_content_length_precheck: true

signature:
  format: cms-pkcs7-detached
  detached_suffix: ".p7s"
  signer_count: 1
  signs_raw_manifest_bytes: true
  signer_certificate_embedded: true

trust_store:
  external_to_manifest: true
  package_scoped: true
  publisher_subject:
    required: true
    comparison: case_insensitive_exact
  certificate_sha256:
    required: true
    format: hex
    length: 64

security:
  unsigned_manifest: deny
  missing_package_trust: deny
  invalid_cms_signature: deny
  multiple_signers: deny
  publisher_mismatch: deny
  certificate_pin_mismatch: deny
  expired_signer_certificate: deny
  parse_before_verification: deny
  oversized_manifest: deny
  oversized_detached_signature: deny
